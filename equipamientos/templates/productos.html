<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Productos - HALCÓN EQUIPAMIENTOS</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0a0a0a;color:#e5e5e5;font-family:Inter,system-ui}</style>
</head>
<body>
<nav class="sticky top-0 z-50 bg-[#111]/90 backdrop-blur border-b border-[#222] px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-6">
    <a href="/" class="flex items-center gap-3">
      <img src="/static/logo_halcon_circular.png" style="width:62px;height:62px;border-radius:50%;border:2px solid #ff8c00;object-fit:cover">
      <div style="line-height:1"><b style="font-size:20px;letter-spacing:1px;color:#e0e0e0">HALCÓN</b><br><span style="font-size:13px;color:#ff8c00;font-weight:700;letter-spacing:1px">EQUIPAMIENTOS</span></div>
    </a>
    <div class="hidden md:flex bg-[#1a1a1a] rounded-full p-1 gap-1 items-center">
      <a href="/" class="px-4 py-2 rounded-full text-sm text-zinc-400">🏠 Inicio</a>
      <a href="/productos/" class="px-4 py-2 rounded-full text-sm bg-[#facc15] text-black font-bold">📦 Productos</a>
      <a href="/listas/" class="px-4 py-2 rounded-full text-sm text-zinc-400">💲 Listas</a>
      <a href="/presupuestos/" class="px-4 py-2 rounded-full text-sm text-zinc-400">📄 Presupuestos</a>
      <a href="/ventas/" class="px-4 py-2 rounded-full text-sm bg-[#22c55e]/20 text-[#4ade80] border border-[#22c55e]/30 font-bold">💰 Ventas</a>
      <a href="/caja/" class="px-4 py-2 rounded-full text-sm bg-[#facc15]/20 text-[#facc15] border border-[#facc15]/30 font-bold">📒 CAJA</a>
    </div>
  </div>
  <div class="flex gap-2">
    <button onclick="limpiarDuplicadosGlobal()" class="bg-[#1e1e1e] border border-[#333] text-zinc-400 px-4 py-2 rounded-full text-xs">🧹 Limpiar .0</button>
    <button onclick="abrirModalProducto()" class="bg-[#facc15] text-black font-bold px-5 py-2.5 rounded-full text-sm">+ Nuevo Producto</button>
  </div>
</nav>
<div class="max-w-[1600px] mx-auto p-4 md:p-6">
  <div class="bg-[#151515] border border-[#262626] rounded-[16px] p-4 md:p-5">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-sm text-zinc-400">📦 Catálogo - <span id="result-count">0</span> productos | <span id="result-count2">0</span> filtrados <span id="badge-cat" class="ml-2 bg-[#1a1a1a] border border-[#333] px-2 py-0.5 rounded-full text-[10px]">TODOS</span></h2>
      <div class="flex gap-2">
        <button onclick="toggleAllProductos(true)" class="bg-[#1e1e1e] border border-[#2a2a2a] rounded-full px-3 py-1 text-[11px]">Abrir todo</button>
        <button onclick="toggleAllProductos(false)" class="bg-[#1e1e1e] border border-[#2a2a2a] rounded-full px-3 py-1 text-[11px]">Cerrar todo</button>
      </div>
    </div>
    <div class="bg-[#facc15] rounded-[12px] p-3 mb-4 flex gap-2 items-center border-2 border-black">
      <span class="text-xl">📷</span>
      <input id="barcode_scanner" class="flex-1 bg-black text-[#facc15] font-mono font-black text-sm rounded-full px-4 py-2 outline-none placeholder:text-zinc-600" placeholder="ESCANEA CODIGO DE BARRAS AQUÍ - LECTOR SIEMPRE ACTIVO" autofocus>
      <span id="lector-status" class="bg-black text-[#facc15] text-[11px] font-black px-3 py-1.5 rounded-full">LECTOR ACTIVO</span>
    </div>
    <div id="scan-result" class="hidden mb-4 bg-[#0f0f0f] border-2 border-[#facc15] rounded-[12px] p-4">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-black tracking-widest text-[#facc15]">PRODUCTO ESCANEADO</span>
        <button onclick="document.getElementById('scan-result').classList.add('hidden')" class="text-xs bg-[#1e1e1e] px-3 py-1 rounded-full">✕ Cerrar</button>
      </div>
      <div id="scan-result-content"></div>
    </div>
    <div class="flex flex-wrap gap-2 mb-4" id="cats">
      <button data-cat="TODOS" class="cat-btn active bg-[#facc15] text-black font-bold px-4 py-1.5 rounded-full text-xs">TODOS</button>
      {% for c in categorias %}
        {% if c %}
        <button data-cat="{{ c }}" class="cat-btn bg-[#1e1e1e] border border-[#2a2a2a] text-zinc-400 hover:text-white px-4 py-1.5 rounded-full text-xs uppercase">{{ c }}</button>
        {% endif %}
      {% endfor %}
    </div>
    <div class="relative">
      <input id="busc" autocomplete="off" placeholder="🔍 Buscar por código, nombre o código de barras..." class="w-full bg-[#0a0a0a] border-2 border-[#2a2a2a] rounded-full px-5 py-3.5 text-sm outline-none focus:border-[#facc15] placeholder:text-zinc-600">
    </div>
  </div>
  <div id="acordeones" class="flex flex-col gap-4 mt-6">
    <div class="text-center py-20 text-zinc-500 text-sm">Cargando productos...</div>
  </div>
</div>
<script>
let todosProductos = [];
let catActual = 'TODOS';
function formatARS(n){ return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'}).format(n||0); }
function getCSRF(){ const m=document.cookie.match(/csrftoken=([^;]+)/); return m?m[1]:''; }
function formatearFechaISO(iso){
  if(!iso) return '';
  try{
    let d = new Date(iso);
    if(isNaN(d.getTime())) return '';
    return `🕒 ${d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){ return ''; }
}
async function cargarTodos(){
  try{
    let res = await fetch(`/api/buscar_productos/?q=&cat=TODOS`);
    let data = await res.json();
    // A-Z por nombre desde el front también por seguridad
    data = data.sort((a,b)=> a.nombre.localeCompare(b.nombre, 'es', {sensitivity:'base'}));
    todosProductos = data;
    document.getElementById('result-count').textContent = data.length;
    filtrarInstantaneo();
    document.getElementById('barcode_scanner').focus();
  }catch(e){
    document.getElementById('acordeones').innerHTML = `<div class="text-center py-10 text-red-400">Error cargando productos</div>`;
  }
}
function filtrarInstantaneo(){
  let q = document.getElementById('busc').value.trim().toLowerCase();
  let filtrados = todosProductos;
  if(catActual !== 'TODOS'){
    filtrados = filtrados.filter(p => (p.categoria||'').toUpperCase() === catActual.toUpperCase());
  }
  if(q.length > 0){
    filtrados = filtrados.filter(p => {
      return (p.codigo||'').toLowerCase().includes(q) || 
             (p.nombre||'').toLowerCase().includes(q) || 
             (p.barcode||'').toLowerCase().includes(q);
    });
  }
  // A-Z
  filtrados = filtrados.sort((a,b)=> a.nombre.localeCompare(b.nombre, 'es', {sensitivity:'base'}));
  document.getElementById('result-count2').textContent = filtrados.length;
  document.getElementById('badge-cat').textContent = catActual;
  renderAcordeones(filtrados);
}
function renderAcordeones(data){
  let cont = document.getElementById('acordeones');
  if(!data.length){
    cont.innerHTML = `<div class="text-center py-16 bg-[#151515] border border-[#262626] rounded-[16px]"><div class="text-sm text-zinc-400">No se encontró "${document.getElementById('busc').value}"</div></div>`;
    return;
  }
  const grupos = {};
  data.forEach(p=>{
    let cat = (p.categoria||'OTRO').toUpperCase();
    if(!grupos[cat]) grupos[cat]=[];
    grupos[cat].push(p);
  });
  const catsOrdenadas = Object.keys(grupos).sort((a,b)=> a.localeCompare(b, 'es', {sensitivity:'base'}));
  cont.innerHTML='';
  catsOrdenadas.forEach(cat=>{
    const prods = grupos[cat].sort((a,b)=> a.nombre.localeCompare(b.nombre, 'es', {sensitivity:'base'}));
    const catId = cat.replace(/[^A-Z0-9]/g,'_');
    const div = document.createElement('div');
    div.className='bg-[#151515] border border-[#262626] rounded-[16px] overflow-hidden w-full';
    div.innerHTML=`
      <div class="w-full flex flex-col md:flex-row md:items-center justify-between gap-2 p-4 hover:bg-[#1c1c1c] transition">
        <button onclick="toggleCat('${catId}')" class="flex items-center gap-4 text-left flex-1">
          <div class="w-11 h-11 rounded-full bg-[#facc15]/15 text-[#facc15] flex items-center justify-center font-black text-[14px]">${prods.length}</div>
          <div>
            <div class="font-black text-[13px] uppercase tracking-wide">${cat} - ${prods.length} PRODUCTOS • A-Z</div>
            <div class="text-[11px] text-zinc-500 mt-0.5">Click para desplegar • Ordenado A-Z por nombre</div>
          </div>
          <span id="arrow-${catId}" class="text-zinc-500 ml-4">▼</span>
        </button>
        <div class="flex items-center gap-2 flex-wrap md:justify-end">
          <div class="flex items-center gap-1 bg-[#0f0f0f] border border-[#333] rounded-full px-2 py-1">
            <input id="pct-${catId}" type="number" placeholder="%" class="bg-transparent w-[50px] text-center text-xs outline-none placeholder:text-zinc-600">
            <span class="text-xs text-zinc-500">%</span>
            <button onclick="aplicarSubaCategoria('${cat}', '${catId}')" class="bg-[#facc15] text-black font-bold px-3 py-1 rounded-full text-[11px] hover:bg-yellow-300">Aplicar suba a ${cat}</button>
          </div>
          <button onclick="guardarCambiosCategoria('${catId}')" class="bg-[#22c55e]/20 border border-[#22c55e]/30 text-[#4ade80] font-bold px-4 py-1.5 rounded-full text-[11px] hover:bg-[#22c55e]/30">💾 Guardar cambios</button>
        </div>
      </div>
      <div id="body-${catId}" class="hidden border-t border-[#262626]">
        <div id="status-${catId}" class="hidden bg-[#facc15]/10 border-b border-[#facc15]/20 text-[11px] text-[#facc15] px-4 py-2"></div>
        <div class="max-h-[700px] overflow-auto">
          <table class="w-full text-[12px]">
            <thead class="sticky top-0 bg-[#1e1e1e] text-[10px] text-zinc-500 uppercase z-10">
              <tr>
                <th class="text-left p-3 w-[120px]">Código</th>
                <th class="text-left p-3">Producto</th>
                <th class="text-center p-3 w-[170px]">Stock</th>
                <th class="text-right p-3 w-[180px]">Precio</th>
                <th class="p-3 w-[160px] text-right">Acción</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-[#1e1e1e]">
              ${prods.map(p=>{
                let fechaTxt = formatearFechaISO(p.fecha_ultimo_cambio_precio);
                return `
                <tr class="hover:bg-[#1e1e1e]/50">
                  <td class="p-3 text-zinc-500 font-mono text-[11px]">${p.codigo} ${p.barcode?`<div class="text-[9px] text-[#facc15]">${p.barcode}</div>`:''}</td>
                  <td class="p-3 text-zinc-300"><div class="max-w-[600px] truncate" title="${p.nombre}">${p.nombre}</div><div class="text-[10px] text-zinc-500">${p.categoria}</div></td>
                  <td class="p-2">
                    <div class="flex items-center justify-center gap-1">
                      <button onclick="cambiarStockProducto(${p.id}, -1)" class="w-7 h-7 rounded-full bg-[#222] border border-[#333] text-white hover:bg-[#333] font-bold flex items-center justify-center">−</button>
                      <input id="stock-${p.id}" type="number" value="${p.stock}" onchange="guardarStockDirecto(${p.id})" class="stock-input-prod bg-[#0f0f0f] border border-[#333] rounded-lg px-1 py-1.5 w-[60px] text-center outline-none focus:border-[#facc15] font-bold ${p.stock==0?'text-red-400':p.stock<=3?'text-yellow-400':'text-green-400'}">
                      <button onclick="cambiarStockProducto(${p.id}, 1)" class="w-7 h-7 rounded-full bg-[#222] border border-[#333] text-white hover:bg-[#333] font-bold flex items-center justify-center">+</button>
                    </div>
                  </td>
                  <td class="p-3 text-right">
                    <div class="flex items-center justify-end gap-1">
                      <span class="text-[10px] text-zinc-500 hidden md:block">$</span>
                      <input id="precio-${p.id}" type="text" value="${p.precio}" 
                        onkeydown="if(event.key==='Enter'){ guardarPrecioDirecto(${p.id}); this.blur(); }" 
                        onblur="guardarPrecioDirecto(${p.id})"
                        class="precio-input bg-[#0f0f0f] border border-[#333] rounded-lg px-2 py-1.5 w-[115px] text-right outline-none focus:border-[#facc15] font-bold text-[#facc15] text-[12px]">
                    </div>
                    <div class="flex flex-col items-end">
                      <div id="precio-status-${p.id}" class="text-[9px] text-green-400 hidden mt-0.5">✓ guardado</div>
                      ${fechaTxt ? `<div class="text-[9px] text-zinc-500 mt-1">${fechaTxt}</div>` : `<div class="text-[9px] text-zinc-600 mt-1">sin cambios aún</div>`}
                    </div>
                  </td>
                  <td class="p-3 text-right">
                    <div class="flex gap-1 justify-end">
                      <button onclick='editarProducto(${JSON.stringify(p).replace(/'/g,"&#39;")})' class="bg-[#1e1e1e] border border-[#333] text-white text-[11px] px-3 py-1.5 rounded-full hover:bg-[#2a2a2a]">✏ Editar</button>
                      <button onclick="mostrarDetalleEscaneado('${p.codigo}')" class="bg-white text-black text-[11px] font-bold px-3 py-1.5 rounded-full">👁</button>
                      <button onclick="eliminarProductoDefinitivo(${p.id}, '${p.codigo}')" class="bg-[#1a1a1a] border border-[#ef4444]/30 text-[#ef4444] text-[11px] px-2 py-1.5 rounded-full">🗑</button>
                    </div>
                  </td>
                </tr>
              `}).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
    cont.appendChild(div);
  });
  if(catsOrdenadas.length<=3){
    catsOrdenadas.forEach(cat=>{
      const catId = cat.replace(/[^A-Z0-9]/g,'_');
      let b = document.getElementById('body-'+catId);
      if(b) b.classList.remove('hidden');
      let a = document.getElementById('arrow-'+catId);
      if(a) a.textContent='▲';
    });
  }
}
function toggleCat(id){
  const body=document.getElementById('body-'+id);
  const arrow=document.getElementById('arrow-'+id);
  if(body.classList.contains('hidden')){ body.classList.remove('hidden'); arrow.textContent='▲'; }
  else{ body.classList.add('hidden'); arrow.textContent='▼'; }
}
function toggleAllProductos(open){
  document.querySelectorAll('[id^=body-]').forEach(b=>{
    if(open) b.classList.remove('hidden'); else b.classList.add('hidden');
  });
  document.querySelectorAll('[id^=arrow-]').forEach(a=>a.textContent=open?'▲':'▼');
}
function cambiarStockProducto(id, delta){
  const inp=document.getElementById('stock-'+id);
  let actual=parseInt(inp.value)||0;
  let nuevo=actual+delta;
  if(nuevo<0) nuevo=0;
  inp.value=nuevo;
  guardarStockDirecto(id);
}
function guardarStockDirecto(id){
  const inp=document.getElementById('stock-'+id);
  let nuevo=parseInt(inp.value)||0;
  inp.style.borderColor='#facc15';
  fetch('/api/actualizar_stock/',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()},
    body:JSON.stringify({producto_id: id, stock: nuevo})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      let p = todosProductos.find(x=>x.id===id);
      if(p) p.stock=d.stock;
      inp.classList.remove('text-red-400','text-yellow-400','text-green-400');
      if(d.stock==0) inp.classList.add('text-red-400');
      else if(d.stock<=3) inp.classList.add('text-yellow-400');
      else inp.classList.add('text-green-400');
      inp.style.borderColor='#22c55e';
      setTimeout(()=>inp.style.borderColor='#333',1000);
    }
  });
}
function parsePrecioInput(s){
  if(!s) return 0;
  s = s.toString().trim().replace(/\$/g,'').replace(/\s/g,'');
  if(s.includes(',')){
    s = s.replace(/\./g,'').replace(',','.');
  }
  return parseFloat(s)||0;
}
function guardarPrecioDirecto(id){
  const inp=document.getElementById('precio-'+id);
  const status=document.getElementById('precio-status-'+id);
  let nuevo=parsePrecioInput(inp.value);
  if(nuevo<=0) return;
  let prod = todosProductos.find(x=>x.id===id);
  if(prod && Math.abs(parseFloat(prod.precio)-nuevo)<0.01){
    return;
  }
  inp.style.borderColor='#facc15';
  fetch('/api/actualizar_precio/',{
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()},
    body:JSON.stringify({producto_id: id, precio: nuevo})
  }).then(r=>r.json()).then(d=>{
    if(d.ok){
      if(prod) prod.precio=d.precio;
      inp.value=d.precio;
      inp.style.borderColor='#22c55e';
      if(status){ status.classList.remove('hidden'); setTimeout(()=>status.classList.add('hidden'), 2000); }
      setTimeout(()=>inp.style.borderColor='#333',1000);
      // actualizar fecha local
      if(prod){
        prod.fecha_ultimo_cambio_precio = new Date().toISOString();
        filtrarInstantaneo();
      }
    } else {
      alert('Error: '+(d.error||''));
      inp.style.borderColor='#ef4444';
    }
  }).catch(e=>{
    inp.style.borderColor='#ef4444';
  });
}
function mostrarDetalleEscaneado(codigo){
  let p = todosProductos.find(x => x.codigo === codigo || x.barcode === codigo);
  if(!p) return;
  let cont = document.getElementById('scan-result');
  let inner = document.getElementById('scan-result-content');
  cont.classList.remove('hidden');
  inner.innerHTML = `
    <div class="flex gap-4">
      <div class="flex-1">
        <div class="text-[11px] text-zinc-500 font-mono">${p.codigo} ${p.barcode ? '• 📷 '+p.barcode : ''}</div>
        <div class="text-lg font-bold text-white mt-1">${p.nombre}</div>
        <div class="text-sm text-zinc-400 mt-1">${p.categoria||''} ${p.fecha_ultimo_cambio_precio ? '• '+formatearFechaISO(p.fecha_ultimo_cambio_precio) : ''}</div>
        <div class="flex gap-2 mt-3">
          <span class="bg-[#facc15] text-black font-black px-4 py-1.5 rounded-full text-sm">${formatARS(p.precio)}</span>
          <span class="bg-[#1e1e1e] border border-[#333] px-4 py-1.5 rounded-full text-xs">Stock: ${p.stock}</span>
        </div>
      </div>
      <div class="flex flex-col gap-2">
        <button onclick='editarProducto(${JSON.stringify(p).replace(/'/g,"&#39;")})' class="bg-[#1e1e1e] text-white px-4 py-2 rounded-full text-xs font-bold">✏ Editar</button>
        <button onclick="eliminarProductoDefinitivo(${p.id}, '${p.codigo}')" class="bg-[#ef4444]/20 text-[#ef4444] border border-[#ef4444]/30 px-4 py-2 rounded-full text-xs font-bold">🗑 Eliminar</button>
      </div>
    </div>
  `;
  cont.scrollIntoView({behavior:'smooth', block:'center'});
  let status = document.getElementById('lector-status');
  status.textContent = '✓ ENCONTRADO';
  status.style.background = '#22c55e';
  status.style.color = 'black';
  setTimeout(()=>{ status.textContent='LECTOR ACTIVO'; status.style.background='black'; status.style.color='#facc15'; }, 1500);
}
async function handleBarcodeScan(code){
  code = code.trim().replace(/\r/g,'').replace(/\n/g,'');
  if(!code) return;
  let p = todosProductos.find(x => 
    (x.barcode && x.barcode.toLowerCase() === code.toLowerCase()) || 
    (x.codigo && x.codigo.toLowerCase() === code.toLowerCase())
  );
  if(p){
    document.getElementById('busc').value = code;
    filtrarInstantaneo();
    mostrarDetalleEscaneado(p.codigo);
    let catId = (p.categoria||'OTRO').toUpperCase().replace(/[^A-Z0-9]/g,'_');
    let body = document.getElementById('body-'+catId);
    if(body && body.classList.contains('hidden')) toggleCat(catId);
    document.getElementById('barcode_scanner').value = '';
    document.getElementById('barcode_scanner').focus();
    return;
  }
  try{
    let res = await fetch(`/api/buscar_productos/?q=${encodeURIComponent(code)}&cat=TODOS`);
    let data = await res.json();
    if(data.length > 0){
      let encontrado = data.find(d => d.barcode === code || d.codigo === code) || data[0];
      if(!todosProductos.find(x=>x.id===encontrado.id)) todosProductos.push(encontrado);
      document.getElementById('busc').value = code;
      filtrarInstantaneo();
      mostrarDetalleEscaneado(encontrado.codigo);
    }else{
      let status = document.getElementById('lector-status');
      status.textContent = '✕ NO EXISTE';
      status.style.background = '#ef4444';
      status.style.color = 'white';
      setTimeout(()=>{ status.textContent='LECTOR ACTIVO'; status.style.background='black'; status.style.color='#facc15'; }, 2000);
      if(confirm(`Código ${code} no existe. ¿Cargarlo?`)){
        abrirModalProductoConCodigo(code, true);
      }
    }
  }catch(e){ console.error(e); }
  document.getElementById('barcode_scanner').value = '';
  document.getElementById('barcode_scanner').focus();
}
function eliminarProductoDefinitivo(id, codigo){
  if(!confirm(`¿Eliminar DEFINITIVO ${codigo}?\n\nSe borrará de PRODUCTOS y de todas las LISTAS.`)) return;
  if(!confirm(`Última confirmación: ¿Borrar ${codigo} para siempre?`)) return;
  fetch(`/api/eliminar_producto/${id}/`, { method: 'POST', headers: { 'X-CSRFToken': getCSRF() } })
  .then(r=>r.json())
  .then(data=>{
    if(data.ok){
      alert(`✅ ${data.codigo} eliminado`);
      todosProductos = todosProductos.filter(x=>x.id!==id);
      filtrarInstantaneo();
    } else alert('Error: ' + data.error);
  });
}
function limpiarDuplicadosGlobal(){
  if(!confirm('¿Limpiar todos los productos con .0 duplicados?')) return;
  fetch('/api/limpiar_duplicados_global/', { method:'POST', headers:{'X-CSRFToken': getCSRF()} })
  .then(r=>r.json()).then(d=>{ if(d.ok){ alert(`✅ Se limpiaron ${d.borrados} duplicados`); cargarTodos(); } else alert('Error: '+d.error); });
}
function abrirModalProducto(){ document.getElementById('modalProducto').classList.remove('hidden'); document.getElementById('modalProducto').classList.add('flex'); document.getElementById('p_id').value=''; document.getElementById('p_codigo').value=''; document.getElementById('p_barcode').value=''; document.getElementById('p_nombre').value=''; document.getElementById('p_categoria').value=catActual!=='TODOS'?catActual:''; document.getElementById('p_precio').value=''; document.getElementById('p_stock').value=''; document.getElementById('p_compat').value=''; }
function abrirModalProductoConCodigo(code, isBarcode=false){ abrirModalProducto(); if(isBarcode){ document.getElementById('p_barcode').value=code; } else { document.getElementById('p_codigo').value=code; document.getElementById('p_nombre').value=code; } }
function cerrarModalProducto(){ document.getElementById('modalProducto').classList.add('hidden'); document.getElementById('modalProducto').classList.remove('flex'); }
function editarProducto(p){ document.getElementById('modalProducto').classList.remove('hidden'); document.getElementById('modalProducto').classList.add('flex'); document.getElementById('p_id').value=p.id; document.getElementById('p_codigo').value=p.codigo; document.getElementById('p_barcode').value=p.barcode||''; document.getElementById('p_nombre').value=p.nombre; document.getElementById('p_categoria').value=p.categoria; document.getElementById('p_precio').value=p.precio; document.getElementById('p_stock').value=p.stock; document.getElementById('p_compat').value=p.compat||''; }
function guardarProducto(){
  let idRaw = document.getElementById('p_id').value.trim();
  let payload = { 
    id: idRaw ? parseInt(idRaw) : null, 
    codigo: document.getElementById('p_codigo').value.trim(), 
    barcode: document.getElementById('p_barcode').value.trim(), 
    nombre: document.getElementById('p_nombre').value.trim(), 
    categoria: document.getElementById('p_categoria').value.trim() || 'OTRO', 
    precio: parseFloat(document.getElementById('p_precio').value||0), 
    stock: parseInt(document.getElementById('p_stock').value||0), 
    compat: document.getElementById('p_compat').value.trim(), 
  };
  if(!payload.codigo || !payload.nombre) return alert('Falta código y nombre');
  fetch('/api/guardar_producto/', { method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()}, body: JSON.stringify(payload) })
  .then(async r=>{ let d = await r.json(); if(!r.ok || !d.ok) throw new Error(d.error || 'Error al guardar'); return d; })
  .then(d=>{ cerrarModalProducto(); cargarTodos(); })
  .catch(err=>{ alert(err.message); });
}
async function aplicarSubaCategoria(categoria, catId){
  const pctInput = document.getElementById('pct-'+catId);
  const status = document.getElementById('status-'+catId);
  let pct = parseFloat(pctInput.value);
  if(!pct || pct===0){ alert('Poné un % válido'); return; }
  if(!confirm(`¿Aplicar ${pct}% de aumento a TODA la categoría ${categoria}?`)) return;
  status.classList.remove('hidden');
  status.textContent = `Aplicando ${pct}% a ${categoria}...`;
  try{
    let res = await fetch('/api/aplicar_suba_categoria/',{
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()},
      body: JSON.stringify({categoria: categoria, porcentaje: pct})
    });
    let data = await res.json();
    if(data.ok){
      status.textContent = `✅ ${data.actualizados} productos actualizados +${pct}%`;
      status.className = 'bg-green-500/20 border-b border-green-500/30 text-[11px] text-green-400 px-4 py-2';
      setTimeout(()=>{ status.classList.add('hidden'); }, 3000);
      cargarTodos();
    } else {
      status.textContent = 'Error: '+(data.error||'');
      status.className = 'bg-red-500/20 border-b border-red-500/30 text-[11px] text-red-400 px-4 py-2';
    }
  } catch(e){
    status.textContent = 'Error de red: '+e.message;
  }
}
async function guardarCambiosCategoria(catId){
  const status = document.getElementById('status-'+catId);
  const body = document.getElementById('body-'+catId);
  status.classList.remove('hidden');
  status.textContent = `💾 Guardando cambios de esta categoría...`;
  status.className = 'bg-[#facc15]/10 border-b border-[#facc15]/20 text-[11px] text-[#facc15] px-4 py-2';
  const inputsPrecio = body.querySelectorAll("input[id^='precio-']");
  const inputsStock = body.querySelectorAll("input[id^='stock-']");
  let cambios = 0;
  let errores = 0;
  for(let inp of inputsPrecio){
    let id = parseInt(inp.id.replace('precio-',''));
    let nuevo = parsePrecioInput(inp.value);
    if(nuevo<=0) continue;
    let prod = todosProductos.find(x=>x.id===id);
    if(prod && Math.abs(parseFloat(prod.precio)-nuevo)<0.01) continue;
    try{
      let res = await fetch('/api/actualizar_precio/',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()},
        body: JSON.stringify({producto_id: id, precio: nuevo})
      });
      let d = await res.json();
      if(d.ok){
        if(prod) prod.precio = d.precio;
        inp.style.borderColor='#22c55e';
        cambios++;
      } else errores++;
    } catch(e){ errores++; }
  }
  for(let inp of inputsStock){
    let id = parseInt(inp.id.replace('stock-',''));
    let nuevo = parseInt(inp.value)||0;
    let prod = todosProductos.find(x=>x.id===id);
    if(prod && prod.stock===nuevo) continue;
    try{
      let res = await fetch('/api/actualizar_stock/',{
        method:'POST',
        headers:{'Content-Type':'application/json','X-CSRFToken': getCSRF()},
        body: JSON.stringify({producto_id: id, stock: nuevo})
      });
      let d = await res.json();
      if(d.ok){
        if(prod) prod.stock = d.stock;
        cambios++;
      } else errores++;
    } catch(e){ errores++; }
  }
  if(errores===0){
    status.textContent = `✅ ${cambios} cambios guardados en Postgres.`;
    status.className = 'bg-[#22c55e]/20 border-b border-[#22c55e]/30 text-[11px] text-[#4ade80] px-4 py-2';
  } else {
    status.textContent = `⚠ ${cambios} guardados, ${errores} con error.`;
    status.className = 'bg-red-500/20 border-b border-red-500/30 text-[11px] text-red-400 px-4 py-2';
  }
  setTimeout(()=>{ status.classList.add('hidden'); }, 5000);
  setTimeout(()=>{ cargarTodos(); }, 1200);
}
document.getElementById('busc').addEventListener('input', ()=>{ setTimeout(filtrarInstantaneo, 100); });
document.querySelectorAll('.cat-btn').forEach(btn=>{ btn.addEventListener('click', ()=>{ document.querySelectorAll('.cat-btn').forEach(b=>{ b.className='cat-btn bg-[#1e1e1e] border border-[#2a2a2a] text-zinc-400 hover:text-white px-4 py-1.5 rounded-full text-xs uppercase'; }); btn.className='cat-btn active bg-[#facc15] text-black font-bold px-4 py-1.5 rounded-full text-xs'; catActual = btn.dataset.cat; filtrarInstantaneo(); }); });
document.getElementById('barcode_scanner').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); handleBarcodeScan(e.target.value); } });
cargarTodos();
</script>
<div id="modalProducto" class="fixed inset-0 z-[100] bg-black/80 backdrop-blur hidden items-center justify-center p-4">

    <div class="mt-3"><label class="text-[11px] text-zinc-500 font-bold">NOMBRE *</label><input id="p_nombre" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-full px-4 py-3 text-sm mt-1 outline-none"></div>
    <div class="grid grid-cols-2 gap-3 mt-3"><div><label class="text-[11px] text-zinc-500 font-bold">CATEGORÍA</label><input id="p_categoria" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-full px-4 py-3 text-sm mt-1 outline-none"></div><div><label class="text-[11px] text-zinc-500 font-bold">PRECIO</label><input id="p_precio" type="number" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-full px-4 py-3 text-sm mt-1 outline-none"></div></div>
    <div class="mt-3"><label class="text-[11px] text-zinc-500 font-bold">COMPATIBILIDAD</label><input id="p_compat" class="w-full bg-[#0a0a0a] border border-[#2a2a2a] rounded-full px-4 py-3 text-sm mt-1 outline-none"></div>
    <div class="flex gap-2 mt-6"><button onclick="cerrarModalProducto()" class="flex-1 bg-[#1e1e1e] text-white font-bold py-3 rounded-full text-sm">Cancelar</button><button onclick="guardarProducto()" class="flex-1 bg-[#facc15] text-black font-black py-3 rounded-full text-sm">💾 Guardar</button></div>
  </div>
</div>
