<!DOCTYPE html>
<html>
<head>
<title>Halcón Equipamientos - Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0e0e0e;color:#fff;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.box{background:#1a1a1a;border:1px solid #333;padding:35px;border-radius:18px;width:100%;max-width:380px;box-shadow:0 10px 40px rgba(0,0,0,.8)}
h2{color:#FFD700;margin:0 0 5px 0;text-align:center}
.sub{color:#888;text-align:center;margin-bottom:25px;font-size:13px}
input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}
button{width:100%;padding:13px;background:#FFD700;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer;margin-top:15px}
button:hover{background:#ffdf33}
#error{color:#ff4444;text-align:center;margin-top:12px;display:none;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h2>HALCÓN</h2>
<div class="sub">EQUIPAMIENTOS - Acceso Clientes</div>
<input id="user" placeholder="Usuario" value="">
<input id="pass" type="password" placeholder="Contraseña">
<button onclick="hacerLogin()">ENTRAR</button>
<div id="error"></div>
</div>
<script>
async function hacerLogin(){
  const u = document.getElementById('user').value.trim();
  const p = document.getElementById('pass').value.trim();
  if(!u || !p){ document.getElementById('error').style.display='block'; document.getElementById('error').innerText='Completá usuario y clave'; return; }
  const r = await fetch('/login/', {
    method:'POST',
    headers:{'Content-Type':'application/json','X-CSRFToken': '{{ csrf_token }}'},
    body: JSON.stringify({username:u, password:p})
  });
  const j = await r.json();
  if(j.ok){
    if(j.is_super) window.location='/super-admin/';
    else window.location='/';
  } else {
    document.getElementById('error').style.display='block';
    document.getElementById('error').innerText=j.error;
  }
}
document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') hacerLogin(); });
</script>
</body>
</html>
