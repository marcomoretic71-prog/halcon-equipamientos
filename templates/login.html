<!DOCTYPE html>
<html>
<head><title>Login Halcon</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh">
<div style="background:#222;padding:40px;border-radius:10px">
<h2 style="color:#facc15">HALCON EQUIPAMIENTOS</h2>
<form method="post" action="/login/">
{% csrf_token %}
<input name="username" placeholder="Usuario" style="width:100%;padding:10px;margin:10px 0"><br>
<input name="password" type="password" placeholder="Clave" style="width:100%;padding:10px;margin:10px 0"><br>
<button style="width:100%;padding:10px;background:#facc15;border:0;font-weight:bold">ENTRAR</button>
</form>
</div>
</body>
</html>
