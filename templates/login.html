<!DOCTYPE html>
<html>
<head><title>Login Halcon</title><meta charset="utf-8"></head>
<body style="background:#111;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
<div style="background:#222;padding:40px;border-radius:12px;width:320px;text-align:center">
<h2 style="color:#facc15;margin-top:0">HALCON</h2>
<p>EQUIPAMIENTOS</p>
<form id="loginForm">
<input id="username" name="username" placeholder="Usuario" required style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box">
<input id="password" name="password" type="password" placeholder="Contraseña" required style="width:100%;padding:12px;margin:10px 0;box-sizing:border-box">
<button type="submit" style="width:100%;padding:12px;background:#facc15;border:0;font-weight:bold;cursor:pointer">ENTRAR</button>
<p id="msg" style="color:#f55;margin-top:15px"></p>
</form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/login/', {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
    body: JSON.stringify({username, password})
  });
  const data = await res.json();
  if(data.ok){
    window.location.href = '/';
  } else {
    document.getElementById('msg').innerText = data.error || 'Error';
  }
});
</script>
</body>
</html>
